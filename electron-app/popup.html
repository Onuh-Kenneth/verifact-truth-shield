<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Verifact</title>
    <style>
      :root {
        --green: #28a05a;
        --green-2: #3bb573;
        --bg: #ffffff;
        --fg: #14202c;
        --muted: #64748b;
        --line: #e5e7eb;
        --red: #c83232;
        --amber: #c89628;
        --gray: #888;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        font: 13px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
        color: var(--fg); background: var(--bg);
        border-radius: 14px;
      }
      .head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 16px; color: #fff;
        background: linear-gradient(135deg, var(--green), var(--green-2));
        -webkit-app-region: drag;
      }
      .head b { font-size: 14px; letter-spacing: 0.3px; }
      .head .actions { -webkit-app-region: no-drag; display: flex; gap: 6px; }
      .head button {
        background: rgba(255,255,255,0.2); border: 0; color: #fff;
        border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px;
      }
      .body { padding: 14px 16px; height: calc(100% - 50px); overflow-y: auto; }
      .quote {
        font-size: 12px; color: var(--muted); font-style: italic;
        border-left: 2px solid var(--green); padding-left: 8px; margin-bottom: 12px;
        max-height: 60px; overflow: hidden;
      }
      .score { font-size: 36px; font-weight: 700; color: var(--green); }
      .score small { font-size: 14px; color: #94a3b8; font-weight: 500; }
      .summary { font-size: 13px; color: #475569; margin-top: 6px; }
      .claim {
        margin-top: 12px; padding: 10px; border-radius: 10px;
        border: 1px solid var(--line); background: #fafafa;
      }
      .badge {
        display: inline-block; font-size: 10px; font-weight: 700;
        text-transform: uppercase; padding: 2px 8px; border-radius: 99px; color: #fff;
      }
      .ctext { font-size: 13px; margin-top: 6px; }
      .reason { font-size: 11px; color: var(--muted); margin-top: 4px; }
      .ev { font-size: 11px; margin-top: 6px; }
      .ev a { color: var(--green); text-decoration: none; }
      .spin {
        width: 28px; height: 28px; border: 3px solid var(--line);
        border-top-color: var(--green); border-radius: 50%;
        animation: sp 1s linear infinite; margin: 30px auto 12px;
      }
      .center { text-align: center; color: var(--muted); font-size: 12px; }
      .empty { padding: 40px 12px; text-align: center; color: var(--muted); }
      .empty h3 { color: var(--fg); margin: 0 0 8px; font-size: 15px; }
      .kbd {
        font-family: ui-monospace, Menlo, monospace; font-size: 11px;
        background: #f1f5f9; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line);
      }
      .err { color: var(--red); font-size: 13px; }
      @keyframes sp { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="head">
      <b>✓ Verifact</b>
      <div class="actions">
        <button id="open">Dashboard</button>
        <button id="close">Close</button>
      </div>
    </div>
    <div class="body" id="body">
      <div class="empty">
        <h3>Ready to fact-check</h3>
        <p>
          Highlight any text in any app, copy it
          (<span class="kbd">⌘C</span> / <span class="kbd">Ctrl+C</span>),
          then press <span class="kbd">⌘⇧V</span> /
          <span class="kbd">Ctrl+Shift+V</span>.
        </p>
        <p>You can also click the tray icon any time.</p>
      </div>
    </div>
    <script>
      const VERDICT_COLORS = {
        true: "#28a05a", false: "#c83232",
        misleading: "#c89628", unverified: "#888",
      };
      const body = document.getElementById("body");
      const esc = (s) => String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));

      window.verifact.on("verifact:loading", ({ text }) => {
        body.innerHTML = `
          <div class="quote">${esc(text.slice(0,200))}${text.length>200?"…":""}</div>
          <div class="spin"></div>
          <div class="center">Verifying claims…</div>`;
      });
      window.verifact.on("verifact:result", (d) => {
        const claims = (d.claims||[]).map(c => `
          <div class="claim">
            <span class="badge" style="background:${VERDICT_COLORS[c.verdict]||"#888"}">${c.verdict}</span>
            <div class="ctext">${esc(c.claim)}</div>
            <div class="reason">${esc(c.reasoning||"")}</div>
            ${(c.evidence||[]).slice(0,2).map(e=>`<div class="ev">→ <a href="${esc(e.url)}" target="_blank">${esc(e.title)}</a></div>`).join("")}
          </div>`).join("");
        body.innerHTML = `
          <div class="score">${d.credibility_score ?? "–"}<small>/100</small></div>
          <div class="summary">${esc(d.summary||"")}</div>
          ${claims}`;
      });
      window.verifact.on("verifact:error", (m) => {
        body.innerHTML = `<div class="err">⚠ ${esc(m)}</div>`;
      });
      document.getElementById("close").onclick = () => window.verifact.close();
      document.getElementById("open").onclick = () => window.verifact.openDashboard();
      // Open external links in default browser
      document.addEventListener("click", (e) => {
        const a = e.target.closest("a[href]");
        if (a && a.href.startsWith("http")) {
          e.preventDefault();
          require && require("electron")?.shell?.openExternal(a.href);
        }
      });
    </script>
  </body>
</html>
